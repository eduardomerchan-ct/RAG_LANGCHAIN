[project]
name = "rag-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eduardo merchan", email = "eduardomerchansalamea@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.32",
    "dotenv>=0.9.9",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "langchain[anthropic]>=1.4.7",
    "numpy>=2.4.6",
    "pypdf>=6.21.3",
    "requests>=2.34.2",
]

[project.scripts]
rag-langchain = "rag_langchain:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
